services:
  caddy:
    image: caddy:latest
    ports:
      - "${CADDY_PORT}:443"
    env_file:
      - .env
    volumes:
      - ./mount/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./mount/certs:/certs
    depends_on:
      - heriverse
      - heriverse-server
      - keycloak  
    networks:
      - backend
    restart: always

  # =======================
  # FRONTEND
  # =======================
  heriverse:
    image: git.3dresearch.it:5050/cnr-h2iosc/heriverse/heriverse-wapp:latest
    container_name: heriverse
    ports:
      - "${HERIVERSE_PORT}:8080"
    env_file:
      - .env
    depends_on:
      - heriverse-server
      - keycloak
    volumes:
      - ./config_env_heriverse.sh:/config_env_heriverse.sh:ro
      - ./mount/heriverse/config/Utils.template.js:/aton/wapps/heriverse/config/Utils.template.js
    entrypoint: ["/bin/sh", "/config_env_heriverse.sh"]
    command: ["pm2-runtime", "ecosystem.config.js"]
    networks:
      - backend
    restart: always

  # =======================
  # BACKEND / API SERVER
  # =======================
  heriverse-server:
    image: git.3dresearch.it:5050/stratigraph/heriverse-server:latest
    container_name: heriverse-server
    environment:
      API_BASE_PATH: ${API_BASE_PATH}
      TOKEN_ENDPOINT: ${TOKEN_ENDPOINT}
      USER_INFO_ENDPOINT: ${USER_INFO_ENDPOINT}
      CLIENT_SECRET_heriverse: ${CLIENT_SECRET}
      CLIENT_ID_heriverse: ${CLIENT_ID}
      SCOPES: ${SCOPES}
      SERVER: ${SERVER}
      DB_HTTP_PROTOCOL: ${DB_HTTP_PROTOCOL}
      DB_USER: ${COUCHDB_USER}
      DB_PASSWORD:  ${COUCHDB_PASSWORD}
      DB_PATH: ${DB_PATH}
      SECURE_CONNECTION: ${SECURE_CONNECTION}
      DOCKER_ENV: ${DOCKER_ENV}
      FILE_PROVIDER: ${FILE_PROVIDER}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_PREFIX: ${S3_PREFIX}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_TEMP_DIR: ${S3_TEMP_DIR}
    ports:
      - "${SERVER_PORT}:3000"
    depends_on:
      - couchdb
      - keycloak
    volumes:
      - ./mount/server/uploads:/app/uploads
    networks:
      - backend
    restart: always
  # =======================
  # DATABASE
  # =======================
  couchdb:
    image: apache/couchdb:3
    container_name: couchdb
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_SECRET: ${COUCHDB_SECRET}
      COUCHDB_SINGLE_NODE: "true"
    ports:
      - ${COUCHDB_PORT}:5984
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
    networks:
      - backend
    restart: always
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak

    command:
      - start
      - --import-realm
      - --http-relative-path=/auth

    environment:
      KC_DB: postgres
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./mount/keycloak/realms/realm-heriverse.json:/opt/keycloak/data/import/realm-heriverse.json

    ports:
      - "${KEYCLOAK_PORT}:8080"

    networks:
      - backend

    restart: always
  postgres:
    image: postgres:18
    ports:
       - "${POSTGRES_HOST_PORT}:5432"
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: always

  # =======================
  # OBJECT STORE (RustFS, Apache-2.0 — S3 API)
  # =======================
  # Le credenziali sono le STESSE variabili S3_* che legge heriverse-server:
  # un solo nome per una sola chiave. Il bucket lo crea heriverse-server
  # (S3_AUTO_CREATE_BUCKET, default true), quindi niente one-shot qui.
  rustfs:
    # Pinnata, con il digest accanto: un tag mobile cambia sotto i piedi.
    image: rustfs/rustfs:1.0.2  # sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    container_name: rustfs

    restart: always

    ports:
      - "${S3_PORT}:${S3_PORT}"   # API S3
      - "${S3_CONSOLE_PORT}:${S3_CONSOLE_PORT}"   # Console Web (/rustfs/console/)

    environment:
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:${S3_PORT}"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:${S3_CONSOLE_PORT}"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    healthcheck:
      # l'endpoint di salute, non solo la porta; curl è nell'immagine
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${S3_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    volumes:
      # Volume NUOVO: il formato su disco cambia da un server S3 all'altro.
      # L'immagine gira come uid 10001 e la sua /data è già di 10001.
      - rustfs_data:/data

# =======================
# RETE E VOLUMI
# =======================
networks:
  backend:
    driver: bridge

volumes:
  couchdb_data:
  couchdb_config:
  postgres_data:
  keycloak_data:
  rustfs_data:
